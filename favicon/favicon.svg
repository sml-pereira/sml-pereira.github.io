<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#d4d4dc" stroke-width="1.5"/>
  <!-- Type matched to .site-nav__brand: same font stack, weight 500, 0.06em
       tracking (1.68 at this size) and the accent colour #1a1a2e.
       y = 32 + capHeight/2 centres the capitals on the disc rather than the
       baseline. x is nudged by half the tracking, because letter-spacing also
       trails the final glyph and would otherwise pull text-anchor="middle"
       centring visibly to the left. -->
  <text x="32.84" y="42"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="500" letter-spacing="1.68"
        fill="#1a1a2e" text-anchor="middle">SP</text>
</svg>
